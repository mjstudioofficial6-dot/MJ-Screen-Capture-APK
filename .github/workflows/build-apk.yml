name: Build MJ Screen Capture APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # Pin Ubuntu 24.04 so the runner OS does not change underneath the build.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find and extract Phase 1 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: No Phase 1 source ZIP found in repository root."
            exit 1
          fi

          echo "Using source ZIP: $ZIP_FILE"
          rm -rf .phase1_source
          mkdir -p .phase1_source
          unzip -q "$ZIP_FILE" -d .phase1_source

          test -f .phase1_source/settings.gradle.kts
          test -f .phase1_source/build.gradle.kts
          test -f .phase1_source/app/build.gradle.kts

          # Preserve the repository's .github directory and replace only the Android source.
          cp -a .phase1_source/. ./
          rm -rf .phase1_source

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK 36 packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0
          chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MJ-Screen-Capture-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
