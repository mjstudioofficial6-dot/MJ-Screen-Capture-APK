name: Build MJ Screen Capture APK - Phase 2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract and validate Phase 2 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/MJ_Phase2_Source_v3.zip"
          SOURCE_DIR="$RUNNER_TEMP/mj_phase2_source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required source ZIP is missing: MJ_Phase2_Source_v3.zip"
            echo "Upload that exact file to the repository root."
            echo "Root files currently present:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          test -f "$SOURCE_DIR/settings.gradle.kts" || {
            echo "ERROR: settings.gradle.kts missing at ZIP root."
            find "$SOURCE_DIR" -maxdepth 4 -type f | sort | head -100
            exit 1
          }
          test -f "$SOURCE_DIR/build.gradle.kts" || {
            echo "ERROR: build.gradle.kts missing at ZIP root."
            exit 1
          }
          test -f "$SOURCE_DIR/app/build.gradle.kts" || {
            echo "ERROR: app/build.gradle.kts missing."
            exit 1
          }
          test -f "$SOURCE_DIR/app/src/main/java/com/mjthakur/screencapture/CaptureService.kt" || {
            echo "ERROR: CaptureService.kt missing from source ZIP."
            exit 1
          }
          test -f "$SOURCE_DIR/app/src/main/java/com/mjthakur/screencapture/MainActivity.kt" || {
            echo "ERROR: MainActivity.kt missing from source ZIP."
            exit 1
          }
          echo "Source ZIP validated and extracted outside the checkout directory."

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar" || {
            echo "ERROR: Android API 36 platform not found on ubuntu-24.04 runner."
            exit 1
          }
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" || {
            echo "ERROR: Android Build Tools 36.0.0/aapt2 not found on ubuntu-24.04 runner."
            exit 1
          }
          echo "Android API 36 and Build Tools 36.0.0 verified. No sdkmanager/PATH lookup is used."

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Build Phase 2 debug APK
        shell: bash
        working-directory: ${{ runner.temp }}/mj_phase2_source
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK to artifact staging folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cp "$RUNNER_TEMP/mj_phase2_source/app/build/outputs/apk/debug/app-debug.apk" \
             "$GITHUB_WORKSPACE/build-output/MJ-Screen-Capture-Phase2-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/build-output/MJ-Screen-Capture-Phase2-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Screen-Capture-Phase2-debug-APK
          path: build-output/MJ-Screen-Capture-Phase2-debug.apk
          if-no-files-found: error
