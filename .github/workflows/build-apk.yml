name: Build MJ Screen Capture APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # IMPORTANT: Extract before setup-gradle so its cache step can find
      # the Gradle build files inside buildsrc/.
      - name: Extract Phase 1 Android source
        run: |
          test -f phase1-source.zip
          mkdir -p buildsrc
          unzip -oq phase1-source.zip -d buildsrc
          test -f buildsrc/settings.gradle.kts
          test -f buildsrc/build.gradle.kts
          test -f buildsrc/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Accept Android SDK licenses and install API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Generate wrapper and build APK
        run: |
          cd buildsrc
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Screen-Capture-debug-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Gradle Wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Wrapper-files
          path: |
            buildsrc/gradlew
            buildsrc/gradlew.bat
            buildsrc/gradle/wrapper/gradle-wrapper.jar
            buildsrc/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn
          retention-days: 14
          
