name: Build MJ Screen Capture APK - Phase 2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract and validate Phase 2 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/MJ_Phase2_Source_v3.zip"
          SOURCE_DIR="$RUNNER_TEMP/mj_phase2_source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required source ZIP is missing: MJ_Phase2_Source_v3.zip"
            echo "Upload that exact ZIP to the repository root."
            echo "Root files currently present:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          unzip -tq "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          for required in \
            settings.gradle.kts \
            build.gradle.kts \
            gradle.properties \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/mjthakur/screencapture/CaptureService.kt \
            app/src/main/java/com/mjthakur/screencapture/MainActivity.kt; do
            if [ ! -f "$SOURCE_DIR/$required" ]; then
              echo "ERROR: Required source file missing: $required"
              find "$SOURCE_DIR" -maxdepth 7 -type f | sort | head -100
              exit 1
            fi
          done

          echo "ZIP integrity and required source files verified."
          echo "Source is isolated at: $SOURCE_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar" || {
            echo "ERROR: Android API 36 platform is not installed on this runner."
            exit 1
          }
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" || {
            echo "ERROR: Android Build Tools 36.0.0 are missing on this runner."
            exit 1
          }
          echo "Android API 36 and Build Tools 36.0.0 verified."

      - name: Download and verify Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          VERSION="9.6.0"
          FILE="gradle-${VERSION}-bin.zip"
          URL="https://services.gradle.org/distributions/${FILE}"
          DOWNLOAD_DIR="$RUNNER_TEMP/gradle-download"
          INSTALL_DIR="$RUNNER_TEMP"
          mkdir -p "$DOWNLOAD_DIR"

          curl --fail --location --retry 3 --retry-delay 2 "$URL" -o "$DOWNLOAD_DIR/$FILE"
          curl --fail --location --retry 3 --retry-delay 2 "${URL}.sha256" -o "$DOWNLOAD_DIR/$FILE.sha256"

          EXPECTED_SHA="$(grep -Eo '^[0-9a-fA-F]{64}' "$DOWNLOAD_DIR/$FILE.sha256" | head -n 1 || true)"
          if [ -z "$EXPECTED_SHA" ]; then
            EXPECTED_SHA="$(awk 'NF {print $1; exit}' "$DOWNLOAD_DIR/$FILE.sha256" | tr -d '\r')"
          fi
          ACTUAL_SHA="$(sha256sum "$DOWNLOAD_DIR/$FILE" | awk '{print $1}')"
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "ERROR: Gradle distribution SHA-256 verification failed."
            exit 1
          fi
          echo "Gradle distribution SHA-256 verified."

          unzip -q "$DOWNLOAD_DIR/$FILE" -d "$INSTALL_DIR"
          test -x "$INSTALL_DIR/gradle-${VERSION}/bin/gradle"
          echo "$INSTALL_DIR/gradle-${VERSION}/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/gradle-${VERSION}/bin/gradle" --version

      - name: Build Phase 2 debug APK
        shell: bash
        working-directory: ${{ runner.temp }}/mj_phase2_source
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK build completed: app/build/outputs/apk/debug/app-debug.apk"

      - name: Copy APK to artifact staging folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cp "$RUNNER_TEMP/mj_phase2_source/app/build/outputs/apk/debug/app-debug.apk" \
             "$GITHUB_WORKSPACE/build-output/MJ-Screen-Capture-Phase2-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/build-output/MJ-Screen-Capture-Phase2-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Screen-Capture-Phase2-debug-APK
          path: build-output/MJ-Screen-Capture-Phase2-debug.apk
          if-no-files-found: error
