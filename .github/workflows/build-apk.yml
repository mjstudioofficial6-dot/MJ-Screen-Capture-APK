name: Build MJ Screen Capture APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Phase 1 source ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi
          echo "Using: $ZIP_FILE"
          rm -rf .phase1_source
          mkdir .phase1_source
          unzip -q "$ZIP_FILE" -d .phase1_source
          test -f .phase1_source/settings.gradle.kts
          test -f .phase1_source/build.gradle.kts
          test -d .phase1_source/app
          rsync -a .phase1_source/ ./
          rm -rf .phase1_source
          echo "Android source extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.0

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Screen-Capture-Phase1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
